substitutions:
  _REGION: asia-southeast1
  _SERVICE: carelink-api
  _REPOSITORY: carelink-images
  _CLOUD_SQL_INSTANCE: hackathon-myhack:asia-southeast1:postgres
  _MATCH_SERVICE_URL: https://carelink-match-service-305487732751.asia-southeast1.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=carelink-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --max-instances=1
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      # --set-env-vars REPLACES the entire env-vars list, so any prior value
      # not listed here (e.g. CARELINK_SQLITE_PATH from the old deploy) is
      # dropped automatically. Don't combine with --remove-env-vars — gcloud
      # rejects the pair.
      - --set-env-vars=CARELINK_ENVIRONMENT=cloud,CARELINK_IAP_REQUIRED=false,CARELINK_CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},CARELINK_DB_NAME=carelink,CARELINK_DB_USER=carelink-runtime@${PROJECT_ID}.iam,CARELINK_CLOUD_SQL_IP_TYPE=PUBLIC,MATCH_SERVICE_URL=${_MATCH_SERVICE_URL}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
