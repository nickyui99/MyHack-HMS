substitutions:
  _REGION: asia-southeast1
  _SERVICE: carelink-api
  _REPOSITORY: carelink-images

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=carelink-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --max-instances=1
      - --set-env-vars=CARELINK_ENVIRONMENT=cloud,CARELINK_IAP_REQUIRED=false,CARELINK_SQLITE_PATH=/tmp/carelink.sqlite

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
